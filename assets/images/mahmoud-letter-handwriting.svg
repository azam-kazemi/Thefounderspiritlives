<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 746" role="img" aria-label="اول هدفت رو مشخص کن، بعد تمرکز کن و رویاهات رو با اراده و پشتکار بساز. شکست ها تنها به تو میگویند راه درستی رو انتخاب کنی پس نترس و با شجاعت هدفت رو دنبال کن.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&amp;display=swap');
    .hand{
      font-family:"Noto Nastaliq Urdu","Aref Ruqaa Ink",Tahoma,serif;
      fill:#4d78b7;
      font-weight:400;
      text-anchor:middle;
      direction:rtl;
    }
  </style>
  <rect width="1171" height="746" fill="#fff"/>
  <g class="hand">
    <text x="585.5" y="102" font-size="62">اول هدفت رو مشخص کن،</text>
    <text x="585.5" y="192" font-size="62">بعد تمرکز کن و رویاهات رو</text>
    <text x="585.5" y="282" font-size="62">با اراده و پشتکار بساز.</text>
    <text x="585.5" y="402" font-size="58">شکست ها تنها به تو میگویند</text>
    <text x="585.5" y="492" font-size="58">راه درستی رو انتخاب کنی پس نترس</text>
    <text x="585.5" y="582" font-size="58">و با شجاعت هدفت رو دنبال کن.</text>
    <text x="585.5" y="696" font-size="40">محمود کاظمی</text>
  </g>
</svg>